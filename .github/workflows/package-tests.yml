name: Build

on:
  workflow_call:

run-name: Build from ${{ github.ref }}

env:
  POETRY_VERSION: "2.1.4"

jobs:
  formatting-tests:
    name: Consistency and formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Install Poetry
        run:
          pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Set up Python 3.x
        uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version-file: .github/.python-version
          cache: 'poetry'

      - name: Install dependencies
        run: poetry sync --with dev

      - name: Formatting tests
        run: |
          poetry run ruff check
          poetry run ruff format --check
          ignore_args=()
          poetry run pip-audit --desc "${ignore_args[@]}"
          
  python-matrix:
    name: Python versions
    uses: ./.github/workflows/python-matrix.yaml
    with:
      repository: ${{ inputs.repository }}

  unit-tests:
    name: Unit Tests
    needs: python-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-22.04, macos-latest, windows-latest ]
        python: ${{ fromJSON(needs.python-matrix.outputs.versions) }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Install Poetry
        run:
          pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Inject poetry plugins
        run: |
          pipx inject poetry poetry-dynamic-versioning

      - name: Set up Python 3.x
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: 'poetry'

      - name: Install dependencies
        run: poetry sync

      - name: Unit tests
        run: poetry run pytest
